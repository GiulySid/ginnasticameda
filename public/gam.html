<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="images/logo/logo50.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GAM | ASD Ginnastica Meda</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <section class="page-hero">
      <div class="container">
        <h1>GAM</h1>
        <p>Ginnastica Artistica Maschile - atleti agonistici.</p>
      </div>
    </section>
    <section class="section">
      <div class="container reveal">
        <div class="athlete-list" id="gam-list"></div>
      </div>
    </section>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
    <script>
      document.getElementById("gam-list").innerHTML = [...GM_DATA.gam]
        .sort((a, b) => a[0].localeCompare(b[0], "it"))
        .map(([n, d]) => `<article class="athlete"><strong>${n}</strong><span>${GM_formatDate(d)}</span></article>`)
        .join("");
    </script>
  </body>
</html>
