<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="images/logo/logo50.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gare | ASD Ginnastica Meda</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header" id="site-header"></header>
    <section class="page-hero">
      <div class="container">
        <h1>Gare</h1>
        <p>Calendario e risultati delle competizioni.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="event-list" id="gare-list"></div>
      </div>
    </section>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
    <script>
      const rows = [...GM_DATA.gare].sort((a, b) => b[1].localeCompare(a[1]));
      document.getElementById("gare-list").innerHTML = rows
        .map(([nome, data, luogo, ris]) => {
          const isNaz = /nazionale/i.test(nome);
          const isGaf = /\bGAF\b/.test(nome);
          const tipo = isNaz ? "Nazionale" : isGaf ? "GAF" : "GAM";
          const clean = nome
            .replace(/^Nazionale\s+/i, "")
            .replace(/^(Squadre|Individuale)\s+/i, "")
            .replace(/\s*-\s*GA[MF](\s+REGIONALE)?$/i, "");
          const kind = /^Squadre/i.test(nome) || /Squadra/i.test(nome) ? "Squadre" : "Individuale";
          return `<article class="event-card">
            <div class="event-card__date">
              <span class="event-card__day">${GM_formatDate(data).split(" ")[0]}</span>
              <span class="event-card__month">${GM_formatDate(data).split(" ").slice(1).join(" ")}</span>
            </div>
            <div class="event-card__body">
              <div class="event-card__tags">
                <span class="tag">${kind}</span>
                <span class="tag tag--${tipo.toLowerCase()}">${tipo}</span>
              </div>
              <h3 class="event-card__title">${clean}</h3>
              <p class="event-card__meta">
                <span>${luogo}</span>
                ${ris ? `<span class="event-card__ris">${ris}</span>` : ""}
              </p>
            </div>
          </article>`;
        })
        .join("");
    </script>
  </body>
</html>
